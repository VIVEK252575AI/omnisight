name: ShopLite sandbox verification

on:
  push:
    branches: [vivek]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shoplite-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoplite-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Build pinned sandbox image
        run: docker build --tag omnisight-shoplite-sandbox:1 --file demo-app/sandbox/Dockerfile demo-app/sandbox

      - name: Verify ShopLite patch inside restricted container
        run: python backend/scripts/verify_shoplite_sandbox.py
